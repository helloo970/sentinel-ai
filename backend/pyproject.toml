[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sentinel-backend"
version = "0.1.0"
description = "Local backend for SENTINEL AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "anthropic>=1.15",
  "psutil>=6.0",
  "httpx>=0.27",
  "defusedxml>=0.7",
  "watchdog>=5.0",
  "send2trash>=1.8",
  "numpy>=2.0",
  "sounddevice>=0.5",
  "cryptography>=43",
  "keyring>=25.0",
  "tzdata>=2024.1",
  "edge-tts>=7.0",
]

[project.optional-dependencies]
voice = [
  "faster-whisper>=1.0",
  "openwakeword>=0.6",
  "piper-tts>=1.2",
]
embeddings = [
  "fastembed>=0.4",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "pre-commit>=4.0",
]
package = [
  "pyinstaller>=6.10",
]

[project.scripts]
sentinel-backend = "sentinel.__main__:main"
sentinel = "sentinel.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# S = flake8-bandit: flags shell=True, eval/exec and other risky patterns
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "N", "RUF"]
# RUF001-003: texts contain typographic characters
# SIM112: Windows environment variables are not case-sensitive
ignore = ["RUF001", "RUF002", "RUF003", "SIM112"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "E501", "RUF015", "RUF059"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
